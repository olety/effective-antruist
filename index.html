<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Phones have no Impact: fetch the headline font (Anton) with the CSS, not after it. -->
    <link rel="preload" href="/src/fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin media="(pointer: coarse)" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7d2fe0" />
    <title>%SITE_title%: get priced in insects</title>
    <meta name="description" content="%SITE_description%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="therotobo" />
    <link rel="canonical" href="%SITE_url%/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_title%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Are you an Effective Antruist?" />
    <meta property="og:description" content="%SITE_description%" />
    <meta property="og:url" content="%SITE_url%/" />
    <meta property="og:image" content="%SITE_url%/og.png" />
    <meta property="og:image:secure_url" content="%SITE_url%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ARE YOU AN EFFECTIVE ANTRUIST? A red HELLO name tag reads: my worth is 17,885,774 INSECTS, over a purple wall of soyjak, bug and trollface stickers." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@therotobo" />
    <meta name="twitter:title" content="Are you an Effective Antruist?" />
    <meta name="twitter:description" content="%SITE_description%" />
    <meta name="twitter:image" content="%SITE_url%/og.png" />
    <meta name="twitter:image:alt" content="ARE YOU AN EFFECTIVE ANTRUIST? A red HELLO name tag reads: my worth is 17,885,774 INSECTS, over a purple wall of soyjak, bug and trollface stickers." />
    <!-- JSON-LD: filled at build by vite.config.ts (jsonLd) from src/copy.ts SITE. -->
    <!--JSONLD-->
  </head>
  <body>
    <canvas id="wall" class="wall" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="sound" role="group" aria-label="Sound">
      <button class="snd" id="sfxToggle" type="button" aria-pressed="false" title="%SOUND_sfxOn%">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M16.5 9.5l5 5m0-5l-5 5" /></svg>
        <span class="sr-only" id="sfxLabel">%SOUND_sfxOn%</span>
      </button>
      <button class="snd" id="musicToggle" type="button" aria-pressed="false" title="%SOUND_musicOn%">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /><path class="off" d="M3 3l18 18" /></svg>
        <span class="sr-only" id="musicLabel">%SOUND_musicOn%</span>
      </button>
    </div>

    <main class="stage" id="stage" data-state="empty">
      <header class="hero" id="hero">
        <h1 class="caption">%SITE_headline%</h1>
        <p class="strip">%SITE_subline%</p>
      </header>

      <section class="card input-card" id="inputCard" aria-label="Your text">
        <label for="text" class="sr-only">%SITE_inputLabel%</label>
        <div class="field">
          <div class="hl" id="hl" aria-hidden="true"></div>
          <textarea id="text" maxlength="1500" rows="4" spellcheck="false" placeholder="%SITE_placeholder%"></textarea>
        </div>
        <div class="try-row">
          <span class="try" id="tryLabel">%SITE_try%</span>
          <div class="chips" id="chips" role="group" aria-labelledby="tryLabel"></div>
        </div>
        <button id="judge" class="btn" type="button">%SITE_button%</button>
        <p class="status" id="status" role="status"></p>
      </section>

      <section class="result" id="result" hidden aria-label="Your result">
        <div class="tag" id="tag">
          <p class="hello">HELLO</p>
          <p class="mwi">my worth is</p>
          <div class="write">
            <p class="num" id="num">0</p>
            <p class="unit">INSECTS</p>
          </div>
          <p class="rate" id="rate"></p>
        </div>

        <div class="pills" id="pills" role="radiogroup" aria-label="%SITE_pillsLabel%"></div>

        <div class="reaction" id="reaction">
          <img id="who" alt="" width="190" height="190" />
          <div class="bubble" id="bubble">
            <p class="line" id="line"></p>
            <p class="cap" id="cap"></p>
            <p class="meta" id="meta"></p>
          </div>
        </div>

        <div class="card ledger-card" id="ledgerCard">
          <h2>%SITE_ledgerTitle%</h2>
          <p class="hint">%SITE_ledgerHint%</p>
          <ol class="ledger" id="ledger"></ol>
        </div>

        <button class="copy" id="copy" type="button">%SITE_copy%</button>
      </section>

      <p class="sr-only" id="announce" aria-live="polite"></p>

      <footer class="foot" id="foot">
        <button class="foot-btn" id="aboutBtn" type="button" aria-expanded="false" aria-controls="about">%SITE_about%</button>
        <section class="card about" id="about" role="dialog" aria-modal="false" aria-labelledby="aboutTitle" tabindex="-1" hidden>
          <div class="about-head">
            <h2 id="aboutTitle">%SITE_aboutTitle%</h2>
            <button class="about-x" id="aboutClose" type="button" aria-label="%SITE_aboutClose%" title="%SITE_aboutClose%">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </div>
          <p class="about-what">%SITE_aboutWhat%</p>
          <p class="about-how">%SITE_aboutHow%</p>
          <div class="about-live" aria-live="polite">
            <p class="live-row" id="brain" data-brain="idle">
              <span class="live-k">%SITE_aboutBrain%</span>
              <span class="live-v"><span id="brainText">%SITE_brainIdle%</span><span class="meter" id="brainMeter" hidden><span id="brainBar"></span></span><button class="brain-go" id="brainGo" type="button" hidden></button></span>
            </p>
            <p class="live-row" id="lastRow" hidden>
              <span class="live-k">%SITE_aboutLast%</span>
              <span class="live-v" id="lastText"></span>
            </p>
          </div>
          <p class="about-credit">%SITE_credit% <a href="%SITE_repo%" target="_blank" rel="noopener">%SITE_source%</a></p>
        </section>
        <button class="foot-btn wall-toggle" id="wallToggle" type="button" aria-pressed="false">%SITE_pauseWall%</button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
