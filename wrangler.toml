name = "hackyard-yard3"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# GLINER_URL: set in .dev.vars for local dev (e.g. http://127.0.0.1:8765). Unset = TS fallback extractor.
# JEV_KEY: secret, .dev.vars locally; never commit.
