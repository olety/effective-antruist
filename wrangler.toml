name = "effective-antruist"
account_id = "70ae12731f3e503777d9f59a6c2c18da"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
routes = [
  { pattern = "effectiveantruist.com", custom_domain = true },
  { pattern = "www.effectiveantruist.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# 404-page: unknown paths get public/404.html with HTTP 404 (one view, no client routes to fall back to).
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# GLINER_URL: set in .dev.vars for local dev (e.g. http://127.0.0.1:8765). Unset = TS fallback extractor.
# JEV_KEY: secret, .dev.vars locally; never commit.
